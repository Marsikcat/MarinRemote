# The installer, built on GitHub's Windows machine: by hand (Actions → build → Run workflow)
# or for a tag v*. The result is in the run's artifacts. Releases (what the app updates itself
# from) are published and signed on the PC that holds the release key: tools/release.py.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependencies
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: Tests
        run: python -m pytest -q
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build
        run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: MarinRemote-Setup
          path: dist/MarinRemote-Setup-*.exe
